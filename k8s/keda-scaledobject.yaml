# NOTE: KEDA deprecated the gcp-pubsub scaler type in favor of a Prometheus-based
# approach, since GCP is deprecating the Monitoring Query Language (MQL) that
# gcp-pubsub relied on. See: https://keda.sh/blog/2025-09-15-gcp-deprecations
#
# This uses GCP's Prometheus-compatible metrics endpoint instead.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: keda-demo-scaledobject
spec:
  scaleTargetRef:
    name: keda-demo-consumer
  pollingInterval: 5
  minReplicaCount: 0
  maxReplicaCount: 10
  cooldownPeriod: 60
  triggers:
    - type: prometheus
      metadata:
        serverAddress: https://monitoring.googleapis.com/v1/projects/keda-demo-madu/location/global/prometheus
        query: 'increase({"__name__"="pubsub.googleapis.com:subscription_num_undelivered_messages","monitored_resource"="pubsub_subscription","subscription_id"="keda-demo-topic-subscription"}[2m])'
        threshold: "5"
        activationThreshold: "0"
        credentialsFromEnv: GOOGLE_APPLICATION_CREDENTIALS_JSON
